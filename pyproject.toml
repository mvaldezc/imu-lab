# ============================================================
# Project metadata
# ============================================================

[project]
name = "imu-lab"
version = "0.2.0"
description = "Lightweight library for reading IMUs through a Raspberry Pi in Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Marco Valdez", email = "mvaldezc@umich.edu" },
]
keywords = ["imu", "driver", "icm-20948", "raspberry pi"]
requires-python = ">=3.15"
dependencies = []

[project.urls]
Repository = "https://github.com/mvaldezc/imu-lab"
Issues = "https://github.com/mvaldezc/imu-lab/issues"
Documentation = "https://github.com/mvaldezc/imu-lab#readme"
Changelog = "https://github.com/mvaldezc/imu-lab/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "hypothesis>=6.170.13",
    "ipykernel>=7.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
]

# ============================================================
# Build
# ============================================================

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

# ============================================================
# Versioning and release (commitizen)
# ============================================================

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true

# ============================================================
# Linting and formatting (ruff)
# ============================================================

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "B", "S", "I", "C90", "UP", "D", "PL"]
ignore = ["E501", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"notebooks/**" = ["D"]
"__init__.py" = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 7
max-statements = 60

# ============================================================
# Testing (pytest + coverage)
# ============================================================

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--cov"]

[tool.coverage.run]
source = ["imu_lab"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"
